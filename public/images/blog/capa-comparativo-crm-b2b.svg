<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020906" />
      <stop offset="60%" stop-color="#04150E" />
      <stop offset="100%" stop-color="#020B08" />
    </linearGradient>

    <linearGradient id="panelGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B231A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05150E" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#3AC97B" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="630" fill="url(#bgGrad8)" />

  <g stroke="#3AC97B" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <g transform="translate(60, 50)">
    <rect width="170" height="26" rx="13" fill="#3AC97B" fill-opacity="0.1" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="16" cy="13" r="4" fill="#3AC97B" />
    <text x="28" y="17" class="mono" font-size="11" font-weight="600" fill="#3AC97B" letter-spacing="1.5">EVERGREEN BRAIN</text>
  </g>

  <g transform="translate(1000, 50)">
    <text x="140" y="17" text-anchor="end" class="mono" font-size="12" fill="#FFF4C7" fill-opacity="0.4">BENCHMARK DE CRMs</text>
  </g>

  <!-- Left: Titles -->
  <g transform="translate(60, 140)">
    <rect width="210" height="28" rx="6" fill="#3AC97B" fill-opacity="0.12" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
    <text x="14" y="19" class="mono" font-size="12" font-weight="600" fill="#3AC97B">COMPARATIVO TÉCNICO</text>

    <text x="0" y="80" class="sans" font-size="46" font-weight="800" fill="#FFF4C7" letter-spacing="-1">
      Kommo vs HubSpot
    </text>
    <text x="0" y="138" class="sans" font-size="40" font-weight="700" fill="#3AC97B" letter-spacing="-0.8">
      vs SleekFlow
    </text>

    <text x="0" y="190" class="sans" font-size="19" font-weight="400" fill="#FFF4C7" fill-opacity="0.75">
      Qual o melhor CRM para vendas conversacionais e WhatsApp no Brasil?
    </text>

    <g transform="translate(0, 240)">
      <rect width="150" height="70" rx="10" fill="url(#panelGrad8)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">KOMMO CRM</text>
      <text x="16" y="56" class="mono" font-size="18" font-weight="700" fill="#3AC97B">TOP WHATSAPP</text>

      <rect x="165" width="150" height="70" rx="10" fill="url(#panelGrad8)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="181" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">HUBSPOT</text>
      <text x="181" y="56" class="mono" font-size="18" font-weight="700" fill="#FFF4C7">ALTO TICKET $</text>

      <rect x="330" width="155" height="70" rx="10" fill="url(#panelGrad8)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="346" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">SLEEKFLOW</text>
      <text x="346" y="56" class="mono" font-size="18" font-weight="700" fill="#3AC97B">CHAT SUPORTE</text>
    </g>
  </g>

  <!-- Right: Comparison Table -->
  <g transform="translate(620, 115)">
    <rect width="520" height="450" rx="16" fill="url(#panelGrad8)" stroke="#1B4D36" stroke-width="1.5" filter="url(#glow8)" />

    <rect width="520" height="38" rx="16" fill="#071D16" />
    <circle cx="24" cy="19" r="5" fill="#EF4444" fill-opacity="0.6" />
    <circle cx="42" cy="19" r="5" fill="#F59E0B" fill-opacity="0.6" />
    <circle cx="60" cy="19" r="5" fill="#3AC97B" fill-opacity="0.6" />
    <text x="82" y="23" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.6">crm_benchmark_matrix_2026.json</text>

    <!-- Table Headers -->
    <g transform="translate(25, 60)">
      <rect width="470" height="35" rx="6" fill="#05140D" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.2" />
      <text x="16" y="22" class="mono" font-size="11" font-weight="700" fill="#FFF4C7" fill-opacity="0.6">CRITÉRIO TÉCNICO</text>
      <text x="190" y="22" class="mono" font-size="11" font-weight="700" fill="#3AC97B">KOMMO</text>
      <text x="300" y="22" class="mono" font-size="11" font-weight="700" fill="#FFF4C7">HUBSPOT</text>
      <text x="400" y="22" class="mono" font-size="11" font-weight="700" fill="#FFF4C7" fill-opacity="0.6">SLEEKFLOW</text>

      <!-- Row 1: WhatsApp Nativo -->
      <g transform="translate(0, 45)">
        <rect width="470" height="65" rx="6" fill="#071E16" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
        <text x="16" y="28" class="sans" font-size="12" font-weight="600" fill="#FFF4C7">WhatsApp Nativo</text>
        <text x="16" y="46" class="sans" font-size="10" fill="#FFF4C7" fill-opacity="0.5">Interface de chat integrada</text>
        <text x="190" y="38" class="mono" font-size="12" font-weight="700" fill="#3AC97B">EXCELENTE ✓</text>
        <text x="300" y="38" class="mono" font-size="11" fill="#F59E0B">Limitado/App</text>
        <text x="400" y="38" class="mono" font-size="11" fill="#3AC97B">Bom</text>
      </g>

      <!-- Row 2: Custo / Licença -->
      <g transform="translate(0, 120)">
        <rect width="470" height="65" rx="6" fill="#05140D" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.15" />
        <text x="16" y="28" class="sans" font-size="12" font-weight="600" fill="#FFF4C7">Custo Anual Total</text>
        <text x="16" y="46" class="sans" font-size="10" fill="#FFF4C7" fill-opacity="0.5">Para equipe de 5 a 15 usuários</text>
        <text x="190" y="38" class="mono" font-size="12" font-weight="700" fill="#3AC97B">Acessível (R$)</text>
        <text x="300" y="38" class="mono" font-size="11" fill="#EF4444">Muito Alto (US$)</text>
        <text x="400" y="38" class="mono" font-size="11" fill="#F59E0B">Médio (US$)</text>
      </g>

      <!-- Row 3: Salesbots & Automação -->
      <g transform="translate(0, 195)">
        <rect width="470" height="65" rx="6" fill="#071E16" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
        <text x="16" y="28" class="sans" font-size="12" font-weight="600" fill="#FFF4C7">Salesbots de Conversa</text>
        <text x="16" y="46" class="sans" font-size="10" fill="#FFF4C7" fill-opacity="0.5">Triagem e distribuição de leads</text>
        <text x="190" y="38" class="mono" font-size="12" font-weight="700" fill="#3AC97B">Nativo Visual ✓</text>
        <text x="300" y="38" class="mono" font-size="11" fill="#F59E0B">Complexo</text>
        <text x="400" y="38" class="mono" font-size="11" fill="#3AC97B">Básico</text>
      </g>

      <!-- Row 4: Veredito -->
      <g transform="translate(0, 270)">
        <rect width="470" height="70" rx="6" fill="#0F3325" stroke="#3AC97B" stroke-width="1.5" />
        <text x="16" y="28" class="mono" font-size="10" font-weight="700" fill="#3AC97B">VEREDITO EVERGREEN PARA OPERAÇÕES BRASIL:</text>
        <text x="16" y="50" class="sans" font-size="13" font-weight="700" fill="#FFF4C7">Kommo CRM entrega o maior ROI para ciclo comercial B2B.</text>
      </g>
    </g>
  </g>

  <line x1="0" y1="628" x2="1200" y2="628" stroke="#3AC97B" stroke-width="3" stroke-opacity="0.6" />
</svg>
