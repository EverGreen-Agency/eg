<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030E0A" />
      <stop offset="50%" stop-color="#051610" />
      <stop offset="100%" stop-color="#020906" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B231A" />
      <stop offset="100%" stop-color="#061610" />
    </linearGradient>

    <!-- Active Card Gradient -->
    <linearGradient id="activeCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2E22" />
      <stop offset="100%" stop-color="#071A12" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#3AC97B" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Canvas Background -->
  <rect width="1080" height="560" rx="16" fill="url(#bg)" stroke="#1B4D36" stroke-width="1" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#3AC97B" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1080" y2="70" />
    <line x1="0" y1="140" x2="1080" y2="140" />
    <line x1="0" y1="210" x2="1080" y2="210" />
    <line x1="0" y1="280" x2="1080" y2="280" />
    <line x1="0" y1="350" x2="1080" y2="350" />
    <line x1="0" y1="420" x2="1080" y2="420" />
    <line x1="0" y1="490" x2="1080" y2="490" />
    <line x1="120" y1="0" x2="120" y2="560" />
    <line x1="240" y1="0" x2="240" y2="560" />
    <line x1="360" y1="0" x2="360" y2="560" />
    <line x1="480" y1="0" x2="480" y2="560" />
    <line x1="600" y1="0" x2="600" y2="560" />
    <line x1="720" y1="0" x2="720" y2="560" />
    <line x1="840" y1="0" x2="840" y2="560" />
    <line x1="960" y1="0" x2="960" y2="560" />
  </g>

  <!-- Header Section -->
  <g transform="translate(48, 44)">
    <rect width="210" height="24" rx="12" fill="#3AC97B" fill-opacity="0.1" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
    <text x="14" y="16" class="mono" font-size="11" font-weight="600" fill="#3AC97B" letter-spacing="1">ARQUITETURA DE DECISÃO</text>
    
    <text x="0" y="58" class="sans" font-size="24" font-weight="700" fill="#FFF4C7" letter-spacing="-0.5">
      Roteamento Especulativo em Cascata
    </text>
    <text x="0" y="82" class="sans" font-size="14" font-weight="400" fill="#FFF4C7" fill-opacity="0.6">
      Modelos System 1 não-autorregressivos (Laya / ModernBERT) aplicados à infraestrutura comercial
    </text>
  </g>

  <!-- ==================== STAGE 1: INGESTÃO ==================== -->
  <g transform="translate(48, 160)">
    <rect width="250" height="270" rx="12" fill="url(#cardBg)" stroke="#1B4D36" stroke-width="1" />
    
    <!-- Step Indicator -->
    <text x="24" y="34" class="mono" font-size="11" font-weight="600" fill="#3AC97B" letter-spacing="1">01 / INGESTÃO</text>
    <text x="24" y="60" class="sans" font-size="17" font-weight="600" fill="#FFF4C7">Eventos Comerciais</text>
    <text x="24" y="80" class="sans" font-size="12" fill="#FFF4C7" fill-opacity="0.5">Fluxo contínuo de entrada</text>
    
    <!-- Items -->
    <g transform="translate(20, 104)">
      <!-- Item 1 -->
      <rect width="210" height="40" rx="6" fill="#04120C" stroke="#1E523A" stroke-width="1" />
      <circle cx="16" cy="20" r="3" fill="#3AC97B" />
      <text x="30" y="24" class="sans" font-size="12" font-weight="500" fill="#FFF4C7" fill-opacity="0.9">Mensagens no WhatsApp</text>
      
      <!-- Item 2 -->
      <rect y="48" width="210" height="40" rx="6" fill="#04120C" stroke="#1E523A" stroke-width="1" />
      <circle cx="16" cy="68" r="3" fill="#3AC97B" />
      <text x="30" y="72" class="sans" font-size="12" font-weight="500" fill="#FFF4C7" fill-opacity="0.9">Novos Leads no CRM</text>
      
      <!-- Item 3 -->
      <rect y="96" width="210" height="40" rx="6" fill="#04120C" stroke="#1E523A" stroke-width="1" />
      <circle cx="16" cy="116" r="3" fill="#3AC97B" />
      <text x="30" y="120" class="sans" font-size="12" font-weight="500" fill="#FFF4C7" fill-opacity="0.9">Objeções em Negociação</text>
    </g>

    <!-- Metric Pill -->
    <text x="24" y="252" class="mono" font-size="11" fill="#3AC97B" font-weight="500">Volume: ~100k eventos/mês</text>
  </g>

  <!-- Connector Line 1 to 2 -->
  <g stroke="#3AC97B" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <line x1="298" y1="295" x2="350" y2="295" />
    <polygon points="354,295 346,291 346,299" fill="#3AC97B" stroke="none" />
  </g>

  <!-- ==================== STAGE 2: ROTEADOR SYSTEM 1 ==================== -->
  <g transform="translate(356, 140)">
    <rect width="320" height="310" rx="14" fill="url(#activeCardBg)" stroke="#3AC97B" stroke-width="1.5" filter="url(#subtleGlow)" />
    
    <!-- Top badge -->
    <rect x="24" y="24" width="160" height="22" rx="11" fill="#3AC97B" fill-opacity="0.15" />
    <text x="34" y="39" class="mono" font-size="10" font-weight="700" fill="#3AC97B" letter-spacing="1">02 / DECISÃO SYSTEM 1</text>
    
    <text x="24" y="76" class="sans" font-size="20" font-weight="700" fill="#FFF4C7">Laya / ModernBERT</text>
    <text x="24" y="98" class="sans" font-size="13" fill="#FFF4C7" fill-opacity="0.6">Classificador de 421M Parâmetros</text>
    
    <!-- Technical Spec Boxes -->
    <g transform="translate(24, 118)">
      <rect width="130" height="48" rx="8" fill="#04120C" stroke="#236347" stroke-width="1" />
      <text x="14" y="22" class="mono" font-size="10" fill="#3AC97B" font-weight="600">LATÊNCIA</text>
      <text x="14" y="39" class="sans" font-size="14" font-weight="700" fill="#FFF4C7">~33 ms</text>

      <rect x="142" width="130" height="48" rx="8" fill="#04120C" stroke="#236347" stroke-width="1" />
      <text x="14" y="22" transform="translate(142, 0)" class="mono" font-size="10" fill="#3AC97B" font-weight="600">CUSTO MARGINAL</text>
      <text x="14" y="39" transform="translate(142, 0)" class="sans" font-size="14" font-weight="700" fill="#FFF4C7">$0 (Local)</text>
    </g>

    <!-- Capabilities List -->
    <g transform="translate(24, 190)" class="sans" font-size="12" fill="#FFF4C7" fill-opacity="0.85">
      <text x="0" y="14">• Escolha (Choice): Roteamento de Ferramenta</text>
      <text x="0" y="36">• Pontuação (Score): Urgência e Perfil do Lead</text>
      <text x="0" y="58">• Decisão (Yes/No): Qualificação Imediata</text>
      <text x="0" y="88" class="mono" font-size="11" font-weight="600" fill="#3AC97B">
        Single Forward Pass · Sem Alucinação
      </text>
    </g>
  </g>

  <!-- Forking Connectors from Stage 2 to Stage 3 -->
  <g stroke="#3AC97B" stroke-width="1.5" fill="none">
    <!-- Fast branch -->
    <path d="M 676 250 C 716 250, 716 215, 746 215" />
    <polygon points="750,215 742,211 742,219" fill="#3AC97B" stroke="none" />
    
    <!-- Slow branch -->
    <path d="M 676 340 C 716 340, 716 375, 746 375" />
    <polygon points="750,375 742,371 742,379" fill="#3AC97B" stroke="none" />
  </g>

  <!-- Labels on connector branches -->
  <rect x="686" y="196" width="56" height="18" rx="4" fill="#04120C" stroke="#1E523A" stroke-width="1" />
  <text x="693" y="209" class="mono" font-size="10" font-weight="700" fill="#3AC97B">80% Vol</text>

  <rect x="686" y="380" width="56" height="18" rx="4" fill="#04120C" stroke="#1E523A" stroke-width="1" />
  <text x="693" y="393" class="mono" font-size="10" font-weight="700" fill="#FFF4C7" fill-opacity="0.6">20% Vol</text>

  <!-- ==================== STAGE 3A: AÇÃO IMEDIATA ==================== -->
  <g transform="translate(754, 160)">
    <rect width="278" height="120" rx="10" fill="url(#cardBg)" stroke="#1B4D36" stroke-width="1" />
    
    <text x="20" y="26" class="mono" font-size="10" font-weight="600" fill="#3AC97B" letter-spacing="1">03A / EXECUÇÃO DIRETA (30ms)</text>
    <text x="20" y="48" class="sans" font-size="15" font-weight="700" fill="#FFF4C7">Ação Imediata no CRM</text>
    
    <g transform="translate(20, 68)" class="sans" font-size="12" fill="#FFF4C7" fill-opacity="0.75">
      <text x="0" y="10">• Atualiza etapa no Kommo CRM</text>
      <text x="0" y="28">• Dispara Salesbot de agendamento</text>
      <text x="0" y="46" font-weight="600" fill="#3AC97B">Zero latência percebida pelo lead</text>
    </g>
  </g>

  <!-- ==================== STAGE 3B: DELIBERAÇÃO COMPLEXA ==================== -->
  <g transform="translate(754, 310)">
    <rect width="278" height="120" rx="10" fill="url(#cardBg)" stroke="#1B4D36" stroke-width="1" />
    
    <text x="20" y="26" class="mono" font-size="10" font-weight="600" fill="#FFF4C7" fill-opacity="0.6" letter-spacing="1">03B / SYSTEM 2 · RACIOCÍNIO</text>
    <text x="20" y="48" class="sans" font-size="15" font-weight="700" fill="#FFF4C7">Frontier LLM (Claude / GPT)</text>
    
    <g transform="translate(20, 68)" class="sans" font-size="12" fill="#FFF4C7" fill-opacity="0.75">
      <text x="0" y="10">• Negociação de objeções complexas</text>
      <text x="0" y="28">• Geração de proposta consultiva</text>
      <text x="0" y="46" fill="#FFF4C7" fill-opacity="0.5">Acionado apenas quando estritamente necessário</text>
    </g>
  </g>

  <!-- ==================== FOOTER KPI SUMMARY ==================== -->
  <g transform="translate(48, 480)">
    <rect width="984" height="44" rx="8" fill="#04120C" stroke="#1B4D36" stroke-width="1" />
    
    <text x="24" y="27" class="mono" font-size="11" font-weight="700" fill="#FFF4C7">BENCHMARK CONSOLIDADO:</text>
    
    <text x="230" y="27" class="sans" font-size="13" font-weight="700" fill="#3AC97B">84% de Economia em API</text>
    <circle cx="430" cy="23" r="2" fill="#3AC97B" fill-opacity="0.5" />
    
    <text x="450" y="27" class="sans" font-size="13" font-weight="700" fill="#3AC97B">33ms Latência de Triagem</text>
    <circle cx="650" cy="23" r="2" fill="#3AC97B" fill-opacity="0.5" />
    
    <text x="670" y="27" class="sans" font-size="13" font-weight="700" fill="#3AC97B">Privacidade On-Premises (LGPD)</text>
  </g>
</svg>
