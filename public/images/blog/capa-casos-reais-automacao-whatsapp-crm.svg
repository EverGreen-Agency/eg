<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020906" />
      <stop offset="60%" stop-color="#04140D" />
      <stop offset="100%" stop-color="#020B08" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="panelGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B231A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05150E" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#3AC97B" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad2)" />

  <!-- Technical Blueprint Grid -->
  <g stroke="#3AC97B" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Header Corner -->
  <g transform="translate(60, 50)">
    <rect width="170" height="26" rx="13" fill="#3AC97B" fill-opacity="0.1" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="16" cy="13" r="4" fill="#3AC97B" />
    <text x="28" y="17" class="mono" font-size="11" font-weight="600" fill="#3AC97B" letter-spacing="1.5">EVERGREEN BRAIN</text>
  </g>

  <g transform="translate(1000, 50)">
    <text x="140" y="17" text-anchor="end" class="mono" font-size="12" fill="#FFF4C7" fill-opacity="0.4">CASOS REAIS · B2B</text>
  </g>

  <!-- Left Side: Main Title & Value Propositions -->
  <g transform="translate(60, 140)">
    <rect width="210" height="28" rx="6" fill="#3AC97B" fill-opacity="0.12" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
    <text x="14" y="19" class="mono" font-size="12" font-weight="600" fill="#3AC97B">ENGENHARIA COMERCIAL</text>

    <text x="0" y="80" class="sans" font-size="50" font-weight="800" fill="#FFF4C7" letter-spacing="-1">
      4 Casos Reais:
    </text>
    <text x="0" y="138" class="sans" font-size="42" font-weight="700" fill="#3AC97B" letter-spacing="-0.8">
      Automação &amp; IA no WhatsApp
    </text>

    <text x="0" y="190" class="sans" font-size="19" font-weight="400" fill="#FFF4C7" fill-opacity="0.75">
      Triagem em 60s, copiloto de objeções e enriquecimento no CRM.
    </text>

    <!-- Mini-metrics -->
    <g transform="translate(0, 240)">
      <rect width="150" height="70" rx="10" fill="url(#panelGrad2)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">SLA PRIMEIRO CONTATO</text>
      <text x="16" y="56" class="mono" font-size="24" font-weight="700" fill="#3AC97B">&lt; 60 seg</text>

      <rect x="165" width="150" height="70" rx="10" fill="url(#panelGrad2)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="181" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">QUALIFICAÇÃO CNPJ</text>
      <text x="181" y="56" class="mono" font-size="24" font-weight="700" fill="#FFF4C7">100% AUTO</text>

      <rect x="330" width="155" height="70" rx="10" fill="url(#panelGrad2)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="346" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">CONVERSÃO PIPELINE</text>
      <text x="346" y="56" class="mono" font-size="24" font-weight="700" fill="#3AC97B">+38%</text>
    </g>
  </g>

  <!-- Right Side: Workflow Diagram Card -->
  <g transform="translate(620, 115)">
    <rect width="520" height="450" rx="16" fill="url(#panelGrad2)" stroke="#1B4D36" stroke-width="1.5" filter="url(#glow2)" />

    <!-- Terminal Header Bar -->
    <rect width="520" height="38" rx="16" fill="#071D16" />
    <circle cx="24" cy="19" r="5" fill="#EF4444" fill-opacity="0.6" />
    <circle cx="42" cy="19" r="5" fill="#F59E0B" fill-opacity="0.6" />
    <circle cx="60" cy="19" r="5" fill="#3AC97B" fill-opacity="0.6" />
    <text x="82" y="23" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.6">commercial_automation_flow.live</text>

    <!-- Step 1: WhatsApp Inbound -->
    <g transform="translate(30, 60)">
      <rect width="460" height="65" rx="8" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
      <circle cx="35" cy="32" r="16" fill="#3AC97B" fill-opacity="0.15" />
      <text x="35" y="36" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#3AC97B">01</text>
      <text x="65" y="27" class="mono" font-size="11" font-weight="700" fill="#3AC97B">WHATSAPP · ENTRADA EM TEMPO REAL</text>
      <text x="65" y="47" class="sans" font-size="13" fill="#FFF4C7">Triagem imediata · Perfilamento sem fricção de formulário</text>
    </g>

    <!-- Connector 1 -->
    <line x1="260" y1="125" x2="260" y2="155" stroke="#3AC97B" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Step 2: CNPJ Enrichment -->
    <g transform="translate(30, 155)">
      <rect width="460" height="65" rx="8" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
      <circle cx="35" cy="32" r="16" fill="#3AC97B" fill-opacity="0.15" />
      <text x="35" y="36" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#3AC97B">02</text>
      <text x="65" y="27" class="mono" font-size="11" font-weight="700" fill="#FFF4C7">ENRIQUECIMENTO AUTOMÁTICO DE DADOS</text>
      <text x="65" y="47" class="sans" font-size="13" fill="#FFF4C7" fill-opacity="0.8">Consulta Receita / CNAE · Porte e Quadro Societário no CRM</text>
    </g>

    <!-- Connector 2 -->
    <line x1="260" y1="220" x2="260" y2="250" stroke="#3AC97B" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Step 3: Objection Copilot -->
    <g transform="translate(30, 250)">
      <rect width="460" height="65" rx="8" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
      <circle cx="35" cy="32" r="16" fill="#3AC97B" fill-opacity="0.15" />
      <text x="35" y="36" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#3AC97B">03</text>
      <text x="65" y="27" class="mono" font-size="11" font-weight="700" fill="#3AC97B">COPILOTO DE OBJEÇÕES EM TEMPO REAL</text>
      <text x="65" y="47" class="sans" font-size="13" fill="#FFF4C7">Argumentos ancorados em ROI sugeridos direto ao Closer</text>
    </g>

    <!-- Connector 3 -->
    <line x1="260" y1="315" x2="260" y2="345" stroke="#3AC97B" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Step 4: Pipeline Kommo CRM -->
    <g transform="translate(30, 345)">
      <rect width="460" height="65" rx="8" fill="#0A261C" stroke="#3AC97B" stroke-width="1.5" />
      <circle cx="35" cy="32" r="16" fill="#3AC97B" fill-opacity="0.25" />
      <text x="35" y="36" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#3AC97B">04</text>
      <text x="65" y="27" class="mono" font-size="11" font-weight="700" fill="#3AC97B">KOMMO CRM · GOVERNANÇA DE VENDAS</text>
      <text x="65" y="47" class="sans" font-size="13" font-weight="600" fill="#FFF4C7">Roteamento para Closer · Alertas de SLA e Auditoria 100%</text>
    </g>
  </g>

  <!-- Bottom Border Accent -->
  <line x1="0" y1="628" x2="1200" y2="628" stroke="#3AC97B" stroke-width="3" stroke-opacity="0.6" />
</svg>
