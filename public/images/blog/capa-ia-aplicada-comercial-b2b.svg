<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020906" />
      <stop offset="60%" stop-color="#04150E" />
      <stop offset="100%" stop-color="#020B08" />
    </linearGradient>

    <linearGradient id="panelGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B231A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05150E" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#3AC97B" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="630" fill="url(#bgGrad3)" />

  <!-- Blueprint Grid -->
  <g stroke="#3AC97B" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Brand Corner -->
  <g transform="translate(60, 50)">
    <rect width="170" height="26" rx="13" fill="#3AC97B" fill-opacity="0.1" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="16" cy="13" r="4" fill="#3AC97B" />
    <text x="28" y="17" class="mono" font-size="11" font-weight="600" fill="#3AC97B" letter-spacing="1.5">EVERGREEN BRAIN</text>
  </g>

  <g transform="translate(1000, 50)">
    <text x="140" y="17" text-anchor="end" class="mono" font-size="12" fill="#FFF4C7" fill-opacity="0.4">AGENTS &amp; RAG B2B</text>
  </g>

  <!-- Left: Titles -->
  <g transform="translate(60, 140)">
    <rect width="210" height="28" rx="6" fill="#3AC97B" fill-opacity="0.12" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
    <text x="14" y="19" class="mono" font-size="12" font-weight="600" fill="#3AC97B">ARQUITETURA DE AGENTES</text>

    <text x="0" y="80" class="sans" font-size="48" font-weight="800" fill="#FFF4C7" letter-spacing="-1">
      IA Aplicada ao
    </text>
    <text x="0" y="138" class="sans" font-size="44" font-weight="700" fill="#3AC97B" letter-spacing="-0.8">
      Comercial B2B
    </text>

    <text x="0" y="190" class="sans" font-size="19" font-weight="400" fill="#FFF4C7" fill-opacity="0.75">
      Além do ChatGPT: Arquitetura de Agentes, RAG e Orquestração Comercial.
    </text>

    <g transform="translate(0, 240)">
      <rect width="150" height="70" rx="10" fill="url(#panelGrad3)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">ESTRUTURA</text>
      <text x="16" y="56" class="mono" font-size="22" font-weight="700" fill="#3AC97B">MULTI-AGENTE</text>

      <rect x="165" width="150" height="70" rx="10" fill="url(#panelGrad3)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="181" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">CONTEXTO</text>
      <text x="181" y="56" class="mono" font-size="22" font-weight="700" fill="#FFF4C7">RAG B2B</text>

      <rect x="330" width="155" height="70" rx="10" fill="url(#panelGrad3)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="346" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">HUMANO</text>
      <text x="346" y="56" class="mono" font-size="22" font-weight="700" fill="#3AC97B">NO LOOP</text>
    </g>
  </g>

  <!-- Right: Architecture Matrix -->
  <g transform="translate(620, 115)">
    <rect width="520" height="450" rx="16" fill="url(#panelGrad3)" stroke="#1B4D36" stroke-width="1.5" filter="url(#glow3)" />

    <rect width="520" height="38" rx="16" fill="#071D16" />
    <circle cx="24" cy="19" r="5" fill="#EF4444" fill-opacity="0.6" />
    <circle cx="42" cy="19" r="5" fill="#F59E0B" fill-opacity="0.6" />
    <circle cx="60" cy="19" r="5" fill="#3AC97B" fill-opacity="0.6" />
    <text x="82" y="23" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.6">agentic_orchestrator_matrix.config</text>

    <!-- Grid 2x2 of Agents -->
    <g transform="translate(30, 60)">
      <!-- Agent 1 -->
      <rect width="215" height="150" rx="10" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <rect x="14" y="14" width="80" height="20" rx="10" fill="#3AC97B" fill-opacity="0.15" />
      <text x="24" y="28" class="mono" font-size="10" font-weight="700" fill="#3AC97B">AGENTE 01</text>
      <text x="14" y="56" class="sans" font-size="15" font-weight="700" fill="#FFF4C7">Triagem &amp; Score</text>
      <text x="14" y="78" class="sans" font-size="11" fill="#FFF4C7" fill-opacity="0.7">Classifica ICP em tempo real</text>
      <text x="14" y="96" class="sans" font-size="11" fill="#FFF4C7" fill-opacity="0.7">Descarta curiosos e desqualificados</text>
      <text x="14" y="130" class="mono" font-size="10" fill="#3AC97B">Status: Ativo · 99.8%</text>

      <!-- Agent 2 -->
      <g transform="translate(245, 0)">
        <rect width="215" height="150" rx="10" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
        <rect x="14" y="14" width="80" height="20" rx="10" fill="#3AC97B" fill-opacity="0.15" />
        <text x="24" y="28" class="mono" font-size="10" font-weight="700" fill="#3AC97B">AGENTE 02</text>
        <text x="14" y="56" class="sans" font-size="15" font-weight="700" fill="#FFF4C7">Enriquecimento</text>
        <text x="14" y="78" class="sans" font-size="11" fill="#FFF4C7" fill-opacity="0.7">Pesquisa decisores no LinkedIn</text>
        <text x="14" y="96" class="sans" font-size="11" fill="#FFF4C7" fill-opacity="0.7">Puxa balanço e CNAE no CRM</text>
        <text x="14" y="130" class="mono" font-size="10" fill="#3AC97B">RAG: Conectado</text>
      </g>
    </g>

    <g transform="translate(30, 235)">
      <!-- Agent 3 -->
      <rect width="215" height="150" rx="10" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <rect x="14" y="14" width="80" height="20" rx="10" fill="#3AC97B" fill-opacity="0.15" />
      <text x="24" y="28" class="mono" font-size="10" font-weight="700" fill="#3AC97B">AGENTE 03</text>
      <text x="14" y="56" class="sans" font-size="15" font-weight="700" fill="#FFF4C7">Copiloto de Vendas</text>
      <text x="14" y="78" class="sans" font-size="11" fill="#FFF4C7" fill-opacity="0.7">Prepara o briefing do Closer</text>
      <text x="14" y="96" class="sans" font-size="11" fill="#FFF4C7" fill-opacity="0.7">Gera respostas a objeções de preço</text>
      <text x="14" y="130" class="mono" font-size="10" fill="#3AC97B">Sugestões em tempo real</text>

      <!-- Agent 4 -->
      <g transform="translate(245, 0)">
        <rect width="215" height="150" rx="10" fill="#0A241B" stroke="#3AC97B" stroke-width="1.5" />
        <rect x="14" y="14" width="80" height="20" rx="10" fill="#3AC97B" fill-opacity="0.25" />
        <text x="24" y="28" class="mono" font-size="10" font-weight="700" fill="#3AC97B">AGENTE 04</text>
        <text x="14" y="56" class="sans" font-size="15" font-weight="700" fill="#FFF4C7">Auditoria de SLA</text>
        <text x="14" y="78" class="sans" font-size="11" fill="#FFF4C7" fill-opacity="0.7">Monitora resposta &lt; 5 minutos</text>
        <text x="14" y="96" class="sans" font-size="11" fill="#FFF4C7" fill-opacity="0.7">Alerta liderança de follow-ups</text>
        <text x="14" y="130" class="mono" font-size="10" fill="#3AC97B">100% dos leads auditados</text>
      </g>
    </g>
  </g>

  <line x1="0" y1="628" x2="1200" y2="628" stroke="#3AC97B" stroke-width="3" stroke-opacity="0.6" />
</svg>
