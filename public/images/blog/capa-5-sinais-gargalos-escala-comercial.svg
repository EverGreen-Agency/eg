<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020906" />
      <stop offset="60%" stop-color="#04150E" />
      <stop offset="100%" stop-color="#020B08" />
    </linearGradient>

    <linearGradient id="panelGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B231A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05150E" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#3AC97B" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="630" fill="url(#bgGrad5)" />

  <!-- Blueprint Grid -->
  <g stroke="#3AC97B" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Brand Corner -->
  <g transform="translate(60, 50)">
    <rect width="170" height="26" rx="13" fill="#3AC97B" fill-opacity="0.1" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="16" cy="13" r="4" fill="#3AC97B" />
    <text x="28" y="17" class="mono" font-size="11" font-weight="600" fill="#3AC97B" letter-spacing="1.5">EVERGREEN BRAIN</text>
  </g>

  <g transform="translate(1000, 50)">
    <text x="140" y="17" text-anchor="end" class="mono" font-size="12" fill="#FFF4C7" fill-opacity="0.4">DIAGNÓSTICO &amp; ESCALA</text>
  </g>

  <!-- Left: Titles -->
  <g transform="translate(60, 140)">
    <rect width="210" height="28" rx="6" fill="#3AC97B" fill-opacity="0.12" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
    <text x="14" y="19" class="mono" font-size="12" font-weight="600" fill="#3AC97B">GARGALOS OPERACIONAIS</text>

    <text x="0" y="80" class="sans" font-size="48" font-weight="800" fill="#FFF4C7" letter-spacing="-1">
      5 Sinais de Alerta:
    </text>
    <text x="0" y="138" class="sans" font-size="40" font-weight="700" fill="#3AC97B" letter-spacing="-0.8">
      Sua Operação Não Aguenta 3x
    </text>

    <text x="0" y="190" class="sans" font-size="19" font-weight="400" fill="#FFF4C7" fill-opacity="0.75">
      Antes de contratar mais vendedores ou dobrar o tráfego, veja onde a máquina quebra.
    </text>

    <g transform="translate(0, 240)">
      <rect width="150" height="70" rx="10" fill="url(#panelGrad5)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">DEPENDÊNCIA</text>
      <text x="16" y="56" class="mono" font-size="22" font-weight="700" fill="#EF4444">DONO/HERÓIS</text>

      <rect x="165" width="150" height="70" rx="10" fill="url(#panelGrad5)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="181" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">SLA ATENDIMENTO</text>
      <text x="181" y="56" class="mono" font-size="22" font-weight="700" fill="#F59E0B">&gt; 4 HORAS</text>

      <rect x="330" width="155" height="70" rx="10" fill="url(#panelGrad5)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="346" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">PREVISIBILIDADE</text>
      <text x="346" y="56" class="mono" font-size="22" font-weight="700" fill="#3AC97B">SISTÊMICA</text>
    </g>
  </g>

  <!-- Right: Stress Curve Chart -->
  <g transform="translate(620, 115)">
    <rect width="520" height="450" rx="16" fill="url(#panelGrad5)" stroke="#1B4D36" stroke-width="1.5" filter="url(#glow5)" />

    <rect width="520" height="38" rx="16" fill="#071D16" />
    <circle cx="24" cy="19" r="5" fill="#EF4444" fill-opacity="0.6" />
    <circle cx="42" cy="19" r="5" fill="#F59E0B" fill-opacity="0.6" />
    <circle cx="60" cy="19" r="5" fill="#3AC97B" fill-opacity="0.6" />
    <text x="82" y="23" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.6">commercial_scalability_stress_test.chart</text>

    <!-- Chart Axes -->
    <g transform="translate(50, 70)">
      <!-- Y Axis -->
      <line x1="30" y1="20" x2="30" y2="280" stroke="#FFF4C7" stroke-opacity="0.2" stroke-width="1.5" />
      <!-- X Axis -->
      <line x1="30" y1="280" x2="430" y2="280" stroke="#FFF4C7" stroke-opacity="0.2" stroke-width="1.5" />

      <text x="25" y="15" text-anchor="end" class="mono" font-size="10" fill="#FFF4C7" fill-opacity="0.5">VOLUME</text>
      <text x="430" y="300" text-anchor="end" class="mono" font-size="10" fill="#FFF4C7" fill-opacity="0.5">COMPLEXIDADE DA OPERAÇÃO →</text>

      <!-- Curve 1: Fragile Operation (Colapse) -->
      <path d="M 30 250 Q 180 180 260 190 T 380 270" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="4,4" />
      <circle cx="260" cy="190" r="5" fill="#EF4444" />
      <text x="270" y="185" class="mono" font-size="10" font-weight="700" fill="#EF4444">PONTO DE RUPTURA (2.1x)</text>

      <!-- Curve 2: Engineered System (Scalable) -->
      <path d="M 30 260 Q 200 200 320 120 T 420 50" fill="none" stroke="#3AC97B" stroke-width="3" />
      <circle cx="420" cy="50" r="5" fill="#3AC97B" />
      <text x="410" y="40" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#3AC97B">SISTEMA EVERGREEN (3x - 5x) ✓</text>

      <!-- Legend and Checklist -->
      <g transform="translate(10, 310)">
        <rect width="420" height="42" rx="6" fill="#05140D" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
        <text x="14" y="18" class="sans" font-size="11" font-weight="600" fill="#FFF4C7">Diagnóstico Técnico:</text>
        <text x="14" y="32" class="mono" font-size="10" fill="#3AC97B">Processos documentados + CRM auditável + SLA automatizado</text>
      </g>
    </g>
  </g>

  <line x1="0" y1="628" x2="1200" y2="628" stroke="#3AC97B" stroke-width="3" stroke-opacity="0.6" />
</svg>
