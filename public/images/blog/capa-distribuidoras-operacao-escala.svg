<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020906" />
      <stop offset="60%" stop-color="#04150E" />
      <stop offset="100%" stop-color="#020B08" />
    </linearGradient>

    <linearGradient id="panelGrad12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B231A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05150E" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow12" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#3AC97B" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="630" fill="url(#bgGrad12)" />

  <g stroke="#3AC97B" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <g transform="translate(60, 50)">
    <rect width="170" height="26" rx="13" fill="#3AC97B" fill-opacity="0.1" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="16" cy="13" r="4" fill="#3AC97B" />
    <text x="28" y="17" class="mono" font-size="11" font-weight="600" fill="#3AC97B" letter-spacing="1.5">EVERGREEN BRAIN</text>
  </g>

  <g transform="translate(1000, 50)">
    <text x="140" y="17" text-anchor="end" class="mono" font-size="12" fill="#FFF4C7" fill-opacity="0.4">DISTRIBUIÇÃO B2B</text>
  </g>

  <!-- Left: Titles -->
  <g transform="translate(60, 140)">
    <rect width="210" height="28" rx="6" fill="#3AC97B" fill-opacity="0.12" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
    <text x="14" y="19" class="mono" font-size="12" font-weight="600" fill="#3AC97B">OPERAÇÃO &amp; ESCALA</text>

    <text x="0" y="80" class="sans" font-size="48" font-weight="800" fill="#FFF4C7" letter-spacing="-1">
      Distribuidoras B2B:
    </text>
    <text x="0" y="138" class="sans" font-size="40" font-weight="700" fill="#3AC97B" letter-spacing="-0.8">
      Modernização &amp; Escala
    </text>

    <text x="0" y="190" class="sans" font-size="19" font-weight="400" fill="#FFF4C7" fill-opacity="0.75">
      Como eliminar a dependência de pessoas específicas e automatizar pedidos.
    </text>

    <g transform="translate(0, 240)">
      <rect width="150" height="70" rx="10" fill="url(#panelGrad12)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">PEDIDOS</text>
      <text x="16" y="56" class="mono" font-size="22" font-weight="700" fill="#3AC97B">AUTO WHATSAPP</text>

      <rect x="165" width="150" height="70" rx="10" fill="url(#panelGrad12)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="181" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">CARTEIRA</text>
      <text x="181" y="56" class="mono" font-size="22" font-weight="700" fill="#FFF4C7">RECORRENTE</text>

      <rect x="330" width="155" height="70" rx="10" fill="url(#panelGrad12)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="346" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">DEPENDÊNCIA</text>
      <text x="346" y="56" class="mono" font-size="22" font-weight="700" fill="#3AC97B">BLINDADA</text>
    </g>
  </g>

  <!-- Right: Operations Flowchart -->
  <g transform="translate(620, 115)">
    <rect width="520" height="450" rx="16" fill="url(#panelGrad12)" stroke="#1B4D36" stroke-width="1.5" filter="url(#glow12)" />

    <rect width="520" height="38" rx="16" fill="#071D16" />
    <circle cx="24" cy="19" r="5" fill="#EF4444" fill-opacity="0.6" />
    <circle cx="42" cy="19" r="5" fill="#F59E0B" fill-opacity="0.6" />
    <circle cx="60" cy="19" r="5" fill="#3AC97B" fill-opacity="0.6" />
    <text x="82" y="23" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.6">distribution_scaling_architecture.flow</text>

    <g transform="translate(30, 60)">
      <!-- Step 1 -->
      <rect width="460" height="75" rx="8" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
      <text x="16" y="26" class="mono" font-size="11" font-weight="700" fill="#3AC97B">01 · CAPTURA E REPOSIÇÃO AUTOMÁTICA</text>
      <text x="16" y="48" class="sans" font-size="12" fill="#FFF4C7" fill-opacity="0.7">Disparo preventivo de recompra antes do cliente ficar sem estoque</text>
      <text x="16" y="66" class="mono" font-size="11" font-weight="700" fill="#3AC97B">Sem depender da memória do vendedor</text>

      <!-- Step 2 -->
      <g transform="translate(0, 95)">
        <rect width="460" height="75" rx="8" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
        <text x="16" y="26" class="mono" font-size="11" font-weight="700" fill="#FFF4C7">02 · INTEGRAÇÃO PEDIDO → ERP → SEPARAÇÃO</text>
        <text x="16" y="48" class="sans" font-size="12" fill="#FFF4C7" fill-opacity="0.7">Ordem emitida direto pelo WhatsApp para a expedição</text>
        <text x="16" y="66" class="mono" font-size="11" font-weight="700" fill="#3AC97B">Tempo de faturamento: de 40 min para 30 segundos</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 190)">
        <rect width="460" height="75" rx="8" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
        <text x="16" y="26" class="mono" font-size="11" font-weight="700" fill="#3AC97B">03 · GESTÃO DE ROTAS &amp; LOGÍSTICA</text>
        <text x="16" y="48" class="sans" font-size="12" fill="#FFF4C7" fill-opacity="0.7">Notificação em tempo real de entrega e canhoto digital</text>
        <text x="16" y="66" class="mono" font-size="11" font-weight="700" fill="#3AC97B">Redução de reentregas em 85%</text>
      </g>

      <!-- Final Banner -->
      <g transform="translate(0, 285)">
        <rect width="460" height="60" rx="8" fill="#0F3325" stroke="#3AC97B" stroke-width="1.5" />
        <text x="230" y="35" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#3AC97B">A OPERAÇÃO RODA INDEPENDENTE DO DONO</text>
      </g>
    </g>
  </g>

  <line x1="0" y1="628" x2="1200" y2="628" stroke="#3AC97B" stroke-width="3" stroke-opacity="0.6" />
</svg>
