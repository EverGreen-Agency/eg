<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020906" />
      <stop offset="60%" stop-color="#04150E" />
      <stop offset="100%" stop-color="#020B08" />
    </linearGradient>

    <linearGradient id="panelGrad11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B231A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05150E" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow11" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#3AC97B" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="630" fill="url(#bgGrad11)" />

  <g stroke="#3AC97B" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <g transform="translate(60, 50)">
    <rect width="170" height="26" rx="13" fill="#3AC97B" fill-opacity="0.1" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="16" cy="13" r="4" fill="#3AC97B" />
    <text x="28" y="17" class="mono" font-size="11" font-weight="600" fill="#3AC97B" letter-spacing="1.5">EVERGREEN BRAIN</text>
  </g>

  <g transform="translate(1000, 50)">
    <text x="140" y="17" text-anchor="end" class="mono" font-size="12" fill="#FFF4C7" fill-opacity="0.4">FINANÇAS &amp; GOVERNANÇA</text>
  </g>

  <!-- Left: Titles -->
  <g transform="translate(60, 140)">
    <rect width="210" height="28" rx="6" fill="#3AC97B" fill-opacity="0.12" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
    <text x="14" y="19" class="mono" font-size="12" font-weight="600" fill="#3AC97B">DRE GERENCIAL</text>

    <text x="0" y="80" class="sans" font-size="52" font-weight="800" fill="#FFF4C7" letter-spacing="-1">
      O Que é DRE:
    </text>
    <text x="0" y="138" class="sans" font-size="40" font-weight="700" fill="#3AC97B" letter-spacing="-0.8">
      A Bússola do Lucro Real
    </text>

    <text x="0" y="190" class="sans" font-size="19" font-weight="400" fill="#FFF4C7" fill-opacity="0.75">
      Por que faturar muito não significa lucrar — e como blindar sua margem.
    </text>

    <g transform="translate(0, 240)">
      <rect width="150" height="70" rx="10" fill="url(#panelGrad11)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">MARGEM BRUTA</text>
      <text x="16" y="56" class="mono" font-size="22" font-weight="700" fill="#3AC97B">PRECIFICAÇÃO</text>

      <rect x="165" width="150" height="70" rx="10" fill="url(#panelGrad11)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="181" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">EBITDA REAL</text>
      <text x="181" y="56" class="mono" font-size="22" font-weight="700" fill="#FFF4C7">EFICIÊNCIA</text>

      <rect x="330" width="155" height="70" rx="10" fill="url(#panelGrad11)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="346" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">LUCRO LÍQUIDO</text>
      <text x="346" y="56" class="mono" font-size="22" font-weight="700" fill="#3AC97B">EM CAIXA</text>
    </g>
  </g>

  <!-- Right: Income Statement Structure -->
  <g transform="translate(620, 115)">
    <rect width="520" height="450" rx="16" fill="url(#panelGrad11)" stroke="#1B4D36" stroke-width="1.5" filter="url(#glow11)" />

    <rect width="520" height="38" rx="16" fill="#071D16" />
    <circle cx="24" cy="19" r="5" fill="#EF4444" fill-opacity="0.6" />
    <circle cx="42" cy="19" r="5" fill="#F59E0B" fill-opacity="0.6" />
    <circle cx="60" cy="19" r="5" fill="#3AC97B" fill-opacity="0.6" />
    <text x="82" y="23" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.6">dre_gerencial_estrutura.finance</text>

    <g transform="translate(30, 60)">
      <!-- Line 1: Receita Bruta -->
      <rect width="460" height="60" rx="6" fill="#05140D" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
      <text x="16" y="25" class="sans" font-size="13" font-weight="600" fill="#FFF4C7">(+) Receita Operacional Bruta</text>
      <text x="440" y="25" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#3AC97B">R$ 500.000 (100%)</text>
      <text x="16" y="45" class="mono" font-size="10" fill="#FFF4C7" fill-opacity="0.5">Total faturado no ciclo de vendas</text>

      <!-- Line 2: CPV / Custos Variáveis -->
      <g transform="translate(0, 75)">
        <rect width="460" height="60" rx="6" fill="#05140D" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.15" />
        <text x="16" y="25" class="sans" font-size="13" font-weight="600" fill="#FFF4C7">(-) Custos das Vendas &amp; Impostos</text>
        <text x="440" y="25" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#EF4444">- R$ 220.000 (44%)</text>
        <text x="16" y="45" class="mono" font-size="10" fill="#FFF4C7" fill-opacity="0.5">Tributos, comissões diretas e insumos</text>
      </g>

      <!-- Line 3: Margem de Contribuição -->
      <g transform="translate(0, 150)">
        <rect width="460" height="60" rx="6" fill="#071E16" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
        <text x="16" y="25" class="sans" font-size="13" font-weight="700" fill="#3AC97B">(=) Margem de Contribuição</text>
        <text x="440" y="25" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#3AC97B">R$ 280.000 (56%)</text>
        <text x="16" y="45" class="mono" font-size="10" fill="#3AC97B">Dinheiro que sobra para pagar a estrutura fixa</text>
      </g>

      <!-- Line 4: Despesas Fixas & Lucro Líquido -->
      <g transform="translate(0, 225)">
        <rect width="460" height="110" rx="8" fill="#0F3325" stroke="#3AC97B" stroke-width="1.5" />
        <text x="16" y="28" class="sans" font-size="13" font-weight="600" fill="#FFF4C7">(-) Despesas Administrativas &amp; Comerciais: - R$ 130.000</text>
        <line x1="16" y1="45" x2="444" y2="45" stroke="#3AC97B" stroke-opacity="0.3" stroke-width="1" />
        <text x="16" y="75" class="sans" font-size="16" font-weight="800" fill="#FFF4C7">(=) Lucro Líquido Real:</text>
        <text x="440" y="75" text-anchor="end" class="mono" font-size="20" font-weight="800" fill="#3AC97B">R$ 150.000 (30%)</text>
        <text x="16" y="98" class="mono" font-size="10" fill="#3AC97B">Margem saudável para reinvestimento e distribuição</text>
      </g>
    </g>
  </g>

  <line x1="0" y1="628" x2="1200" y2="628" stroke="#3AC97B" stroke-width="3" stroke-opacity="0.6" />
</svg>
