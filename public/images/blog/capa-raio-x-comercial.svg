      <text x="380" y="48" class="mono" font-size="11" font-weight="700" fill="#3AC97B">92% ALINHADO</text>
      <text x="16" y="65" class="sans" font-size="11" fill="#FFF4C7" fill-opacity="0.6">Cadência de 7 toques automatizada pós-proposta</text>
