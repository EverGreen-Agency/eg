<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020906" />
      <stop offset="60%" stop-color="#04150E" />
      <stop offset="100%" stop-color="#020B08" />
    </linearGradient>

    <linearGradient id="panelGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B231A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05150E" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#3AC97B" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="630" fill="url(#bgGrad6)" />

  <!-- Blueprint Grid -->
  <g stroke="#3AC97B" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Brand Corner -->
  <g transform="translate(60, 50)">
    <rect width="170" height="26" rx="13" fill="#3AC97B" fill-opacity="0.1" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="16" cy="13" r="4" fill="#3AC97B" />
    <text x="28" y="17" class="mono" font-size="11" font-weight="600" fill="#3AC97B" letter-spacing="1.5">EVERGREEN BRAIN</text>
  </g>

  <g transform="translate(1000, 50)">
    <text x="140" y="17" text-anchor="end" class="mono" font-size="12" fill="#FFF4C7" fill-opacity="0.4">ROI DE AUTOMAÇÃO</text>
  </g>

  <!-- Left: Titles -->
  <g transform="translate(60, 140)">
    <rect width="210" height="28" rx="6" fill="#3AC97B" fill-opacity="0.12" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
    <text x="14" y="19" class="mono" font-size="12" font-weight="600" fill="#3AC97B">EFICIÊNCIA &amp; ROI</text>

    <text x="0" y="80" class="sans" font-size="48" font-weight="800" fill="#FFF4C7" letter-spacing="-1">
      IA para Empresas:
    </text>
    <text x="0" y="138" class="sans" font-size="42" font-weight="700" fill="#3AC97B" letter-spacing="-0.8">
      Além do ChatGPT
    </text>

    <text x="0" y="190" class="sans" font-size="19" font-weight="400" fill="#FFF4C7" fill-opacity="0.75">
      Automações comerciais que reduzem custos reais e multiplicam o output.
    </text>

    <g transform="translate(0, 240)">
      <rect width="150" height="70" rx="10" fill="url(#panelGrad6)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">HORAS POUPADAS</text>
      <text x="16" y="56" class="mono" font-size="24" font-weight="700" fill="#3AC97B">30h / sem</text>

      <rect x="165" width="150" height="70" rx="10" fill="url(#panelGrad6)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="181" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">CUSTO OPERACIONAL</text>
      <text x="181" y="56" class="mono" font-size="24" font-weight="700" fill="#FFF4C7">-42%</text>

      <rect x="330" width="155" height="70" rx="10" fill="url(#panelGrad6)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="346" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">PAYBACK ESTIMADO</text>
      <text x="346" y="56" class="mono" font-size="24" font-weight="700" fill="#3AC97B">&lt; 45 DIAS</text>
    </g>
  </g>

  <!-- Right: ROI Breakdown Grid -->
  <g transform="translate(620, 115)">
    <rect width="520" height="450" rx="16" fill="url(#panelGrad6)" stroke="#1B4D36" stroke-width="1.5" filter="url(#glow6)" />

    <rect width="520" height="38" rx="16" fill="#071D16" />
    <circle cx="24" cy="19" r="5" fill="#EF4444" fill-opacity="0.6" />
    <circle cx="42" cy="19" r="5" fill="#F59E0B" fill-opacity="0.6" />
    <circle cx="60" cy="19" r="5" fill="#3AC97B" fill-opacity="0.6" />
    <text x="82" y="23" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.6">operational_roi_simulation.b2b</text>

    <!-- 3 Rows of ROI Comparison -->
    <g transform="translate(30, 60)">
      <!-- Case 1 -->
      <rect width="460" height="90" rx="8" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
      <text x="18" y="26" class="mono" font-size="11" font-weight="700" fill="#3AC97B">01 · GERAÇÃO E AUDITORIA DE PROPOSTAS</text>
      <text x="18" y="48" class="sans" font-size="12" fill="#FFF4C7" fill-opacity="0.6">Antes: 45 min por proposta manual em Word/PDF</text>
      <text x="18" y="70" class="sans" font-size="13" font-weight="600" fill="#3AC97B">Depois com IA: 90 segundos direto pelo CRM (100% sem erros)</text>
    </g>

    <g transform="translate(30, 165)">
      <!-- Case 2 -->
      <rect width="460" height="90" rx="8" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
      <text x="18" y="26" class="mono" font-size="11" font-weight="700" fill="#3AC97B">02 · FOLLOW-UP E RESPOSTA A CLIENTES INATIVOS</text>
      <text x="18" y="48" class="sans" font-size="12" fill="#FFF4C7" fill-opacity="0.6">Antes: Vendedores esquecem leads frios em 3 dias</text>
      <text x="18" y="70" class="sans" font-size="13" font-weight="600" fill="#3AC97B">Depois com IA: Cadência ativa personalizada (28% reativados)</text>
    </g>

    <g transform="translate(30, 270)">
      <!-- Case 3 -->
      <rect width="460" height="90" rx="8" fill="#0A241B" stroke="#3AC97B" stroke-width="1.5" />
      <text x="18" y="26" class="mono" font-size="11" font-weight="700" fill="#3AC97B">03 · AUDITORIA E GOVERNANÇA DE VENDAS</text>
      <text x="18" y="48" class="sans" font-size="12" fill="#FFF4C7" fill-opacity="0.6">Antes: Reuniões semanais sem dados confiáveis</text>
      <text x="18" y="70" class="sans" font-size="13" font-weight="600" fill="#FFF4C7">Depois com IA: Dashboard em tempo real com alertas de vazamento</text>
    </g>

    <!-- Bottom Metric Banner -->
    <g transform="translate(30, 375)">
      <rect width="460" height="45" rx="8" fill="#0F3325" stroke="#3AC97B" stroke-width="1" />
      <text x="230" y="28" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#3AC97B">IMPACTO MÉDIO: +R$ 84.000 EM MARGEM ANUAL</text>
    </g>
  </g>

  <line x1="0" y1="628" x2="1200" y2="628" stroke="#3AC97B" stroke-width="3" stroke-opacity="0.6" />
</svg>
