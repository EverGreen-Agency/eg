<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020906" />
      <stop offset="60%" stop-color="#05140D" />
      <stop offset="100%" stop-color="#020B08" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B231A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#04120C" stop-opacity="0.95" />
    </linearGradient>

    <!-- Metric Card Gradient -->
    <linearGradient id="metricGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3AC97B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3AC97B" stop-opacity="0.03" />
    </linearGradient>

    <!-- Subtle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#3AC97B" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Technical Blueprint Grid -->
  <g stroke="#3AC97B" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Brand Watermark / Corner Header -->
  <g transform="translate(60, 50)">
    <rect width="170" height="26" rx="13" fill="#3AC97B" fill-opacity="0.1" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="16" cy="13" r="4" fill="#3AC97B" />
    <text x="28" y="17" class="mono" font-size="11" font-weight="600" fill="#3AC97B" letter-spacing="1.5">EVERGREEN BRAIN</text>
  </g>

  <g transform="translate(1000, 50)">
    <text x="140" y="17" text-anchor="end" class="mono" font-size="12" fill="#FFF4C7" fill-opacity="0.4">SYSTEM 1 ARCHITECTURE</text>
  </g>

  <!-- Left Side: Article Headline & Badges -->
  <g transform="translate(60, 140)">
    <rect width="210" height="28" rx="6" fill="#3AC97B" fill-opacity="0.12" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.25" />
    <text x="14" y="19" class="mono" font-size="12" font-weight="600" fill="#3AC97B">LATÊNCIA ULTRA-BAIXA</text>

    <!-- Main Title -->
    <text x="0" y="80" class="sans" font-size="52" font-weight="800" fill="#FFF4C7" letter-spacing="-1">
      Jev &amp; Laya:
    </text>
    <text x="0" y="138" class="sans" font-size="44" font-weight="700" fill="#3AC97B" letter-spacing="-0.8">
      A Revolução System 1
    </text>

    <text x="0" y="190" class="sans" font-size="20" font-weight="400" fill="#FFF4C7" fill-opacity="0.75" width="480">
      Por que o futuro dos agentes de IA não são apenas LLMs autoregressivos.
    </text>

    <!-- Key Metrics Badges -->
    <g transform="translate(0, 240)">
      <rect width="145" height="70" rx="10" fill="url(#panelGrad)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="16" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">INFERÊNCIA</text>
      <text x="16" y="56" class="mono" font-size="26" font-weight="700" fill="#3AC97B">33 ms</text>

      <rect x="160" width="155" height="70" rx="10" fill="url(#panelGrad)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="176" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">ECONOMIA DE TOKEN</text>
      <text x="176" y="56" class="mono" font-size="26" font-weight="700" fill="#FFF4C7">-94%</text>

      <rect x="330" width="155" height="70" rx="10" fill="url(#panelGrad)" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.3" />
      <text x="346" y="28" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.5">ROTEAMENTO</text>
      <text x="346" y="56" class="mono" font-size="22" font-weight="700" fill="#3AC97B">CASCATA</text>
    </g>
  </g>

  <!-- Right Side: Architecture Blueprint Schema -->
  <g transform="translate(620, 115)">
    <!-- Main Outer Container -->
    <rect width="520" height="450" rx="16" fill="url(#panelGrad)" stroke="#1B4D36" stroke-width="1.5" filter="url(#glow)" />

    <!-- Terminal Header Bar -->
    <rect width="520" height="38" rx="16" fill="#071D16" />
    <circle cx="24" cy="19" r="5" fill="#EF4444" fill-opacity="0.6" />
    <circle cx="42" cy="19" r="5" fill="#F59E0B" fill-opacity="0.6" />
    <circle cx="60" cy="19" r="5" fill="#3AC97B" fill-opacity="0.6" />
    <text x="82" y="23" class="mono" font-size="11" fill="#FFF4C7" fill-opacity="0.6">decision_matrix_pipeline.v1</text>

    <!-- Node 1: Inbound Lead Message -->
    <g transform="translate(30, 60)">
      <rect width="460" height="60" rx="8" fill="#051610" stroke="#3AC97B" stroke-width="1" stroke-opacity="0.2" />
      <text x="16" y="24" class="mono" font-size="10" fill="#3AC97B">EVENTO ENTRANTE [WHATSAPP / CRM]</text>
      <text x="16" y="44" class="sans" font-size="13" font-weight="500" fill="#FFF4C7">"Preciso de uma proposta comercial urgente para 50 vidas..."</text>
    </g>

    <!-- Downward Arrow -->
    <line x1="260" y1="120" x2="260" y2="150" stroke="#3AC97B" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="256,150 264,150 260,156" fill="#3AC97B" />

    <!-- Node 2: Fast System 1 Classifier (Jev / Laya) -->
    <g transform="translate(30, 160)">
      <rect width="460" height="110" rx="10" fill="#0A241B" stroke="#3AC97B" stroke-width="1.5" />
      <rect x="360" y="14" width="85" height="24" rx="12" fill="#3AC97B" fill-opacity="0.2" />
      <text x="375" y="30" class="mono" font-size="11" font-weight="700" fill="#3AC97B">⚡ 33ms</text>
      
      <text x="20" y="28" class="mono" font-size="12" font-weight="700" fill="#3AC97B">SISTEMA 1 · CLASSIFICADOR EMBEDDED</text>
      <text x="20" y="50" class="sans" font-size="12" fill="#FFF4C7" fill-opacity="0.8">Arquitetura não-autoregressiva (ModernBERT fine-tuned)</text>
      
      <!-- Probability Bars -->
      <g transform="translate(20, 68)">
        <text x="0" y="12" class="mono" font-size="10" fill="#FFF4C7" fill-opacity="0.5">INTENÇÃO_ALTA_URGÊNCIA</text>
        <rect x="180" y="2" width="230" height="12" rx="4" fill="#05140D" />
        <rect x="180" y="2" width="220" height="12" rx="4" fill="#3AC97B" />
        <text x="420" y="12" class="mono" font-size="10" font-weight="700" fill="#3AC97B">96.8%</text>
      </g>
      <g transform="translate(20, 88)">
        <text x="0" y="12" class="mono" font-size="10" fill="#FFF4C7" fill-opacity="0.5">CHURN_OU_SUPORTE</text>
        <rect x="180" y="2" width="230" height="12" rx="4" fill="#05140D" />
        <rect x="180" y="2" width="8" height="12" rx="4" fill="#6B7280" />
        <text x="420" y="12" class="mono" font-size="10" fill="#FFF4C7" fill-opacity="0.4">1.2%</text>
      </g>
    </g>

    <!-- Branching Lines -->
    <path d="M 140 270 L 140 310" stroke="#3AC97B" stroke-width="1.5" />
    <path d="M 380 270 L 380 310" stroke="#FFF4C7" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Branch A: Direct Instant Action -->
    <g transform="translate(30, 310)">
      <rect width="215" height="105" rx="8" fill="#051610" stroke="#3AC97B" stroke-width="1" />
      <text x="14" y="24" class="mono" font-size="10" font-weight="700" fill="#3AC97B">ROTA A · DISPARO DIRETO</text>
      <text x="14" y="44" class="sans" font-size="12" font-weight="600" fill="#FFF4C7">Atribuição SDR Imediata</text>
      <text x="14" y="62" class="sans" font-size="11" fill="#FFF4C7" fill-opacity="0.7">SLA &lt; 60 segundos</text>
      <text x="14" y="80" class="mono" font-size="10" fill="#3AC97B">Custo: R$ 0,0001</text>
    </g>

    <!-- Branch B: Deep Reasoning (System 2) -->
    <g transform="translate(275, 310)">
      <rect width="215" height="105" rx="8" fill="#051610" stroke="#FFF4C7" stroke-width="1" stroke-opacity="0.2" />
      <text x="14" y="24" class="mono" font-size="10" fill="#FFF4C7" fill-opacity="0.5">ROTA B · SISTEMA 2 (LLM)</text>
      <text x="14" y="44" class="sans" font-size="12" font-weight="600" fill="#FFF4C7">Raciocínio Profundo</text>
      <text x="14" y="62" class="sans" font-size="11" fill="#FFF4C7" fill-opacity="0.5">Apenas para casos ambíguos</text>
      <text x="14" y="80" class="mono" font-size="10" fill="#FFF4C7" fill-opacity="0.4">Latência: ~2.400ms</text>
    </g>
  </g>

  <!-- Bottom Border Highlight -->
  <line x1="0" y1="628" x2="1200" y2="628" stroke="#3AC97B" stroke-width="3" stroke-opacity="0.6" />
</svg>
